{{- if and .Values.httpRoute.enabled .Values.collabora.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.collabora.redirectRouteName | default (printf "%s-collabora-http-redirect" (include "opencloud.fullname" .)) }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collabora
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
      {{- if .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}-collabora-http
      {{- else if .Values.httpRoute.gateway.create }}
      sectionName: {{ include "opencloud.fullname" . }}-collabora-http
      {{- end }}
  hostnames:
    - {{ .Values.global.domain.collabora | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .Values.global.domain.collabora }}
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.collabora.routeName | default (printf "%s-collabora-httproute" (include "opencloud.fullname" .)) }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collabora
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
      {{- if .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}-collabora-https
      {{- else if .Values.httpRoute.gateway.create }}
      sectionName: {{ include "opencloud.fullname" . }}-collabora-https
      {{- end }}
  hostnames:
    - {{ .Values.global.domain.collabora | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "opencloud.fullname" . }}-collabora
          port: 9980
{{- end }}
