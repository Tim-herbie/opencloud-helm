{{- if and .Values.httpRoute.enabled .Values.collaboration.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.collaboration.redirectRouteName | default (printf "%s-collaboration-http-redirect" (include "opencloud.fullname" .)) }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collaboration
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
      {{- if .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}-wopi-http
      {{- else if .Values.httpRoute.gateway.create }}
      sectionName: {{ include "opencloud.fullname" . }}-wopi-http
      {{- end }}
  hostnames:
    - {{ .Values.global.domain.wopi | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .Values.global.domain.wopi }}
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.collaboration.routeName | default (printf "%s-collaboration-httproute" (include "opencloud.fullname" .)) }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collaboration
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
      {{- if .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}-wopi-https
      {{- else if .Values.httpRoute.gateway.create }}
      sectionName: {{ include "opencloud.fullname" . }}-wopi-https
      {{- end }}
  hostnames:
    - {{ .Values.global.domain.wopi | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "opencloud.fullname" . }}-collaboration
          port: 9300
{{- end }}
