{{- if .Values.httpRoute.gateway.create }}
{{- $prefix := .Values.httpRoute.gateway.sectionName | default (include "opencloud.fullname" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.httpRoute.gateway.name }}
  namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
  labels:
    {{- include "opencloud.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.httpRoute.gateway.className }}
  {{- with .Values.httpRoute.gateway.infrastructure }}
  infrastructure:
      {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
    # OpenCloud (proxy) - HTTP redirect listener
    - name: {{ $prefix }}-proxy-http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.global.domain.opencloud | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
    # Collabora - HTTP redirect listener (conditional)
    {{- if .Values.collabora.enabled }}
    - name: {{ $prefix }}-collabora-http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.global.domain.collabora | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
    {{- end }}
    {{- if .Values.global.tls.enabled }}
    # --- HTTPS listeners (TLS termination at this Gateway) ---
    # OpenCloud (proxy) - HTTPS listener
    - name: {{ $prefix }}-proxy-https
      protocol: HTTPS
      port: {{ .Values.httpRoute.gateway.port }}
      hostname: {{ .Values.global.domain.opencloud | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.global.tls.secretName }}
            namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
    {{- if .Values.collabora.enabled }}
    # Collabora - HTTPS listener (conditional)
    - name: {{ $prefix }}-collabora-https
      protocol: HTTPS
      port: {{ .Values.httpRoute.gateway.port }}
      hostname: {{ .Values.global.domain.collabora | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.global.tls.secretName }}
            namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace }}
    {{- end }}
    {{- end }}
{{- end }}