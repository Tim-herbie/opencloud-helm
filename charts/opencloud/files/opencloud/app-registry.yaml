# Optional app-registry override for deployments that need explicit MIME
# creation/default-app policy. It is intentionally not loaded by default.
# OpenCloud's built-in app-registry defaults are used automatically, matching
# the Collabora Docker Compose deployment.
#
# To enable an override, set opencloud.config.appRegistry in Helm values; the
# chart then renders and mounts /etc/opencloud/app-registry.yaml.
